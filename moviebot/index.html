<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://telegram.org/js/telegram-web-app.js"></script><style>body{font-family:system-ui;background:var(--tg-theme-bg-color,#fff);color:var(--tg-theme-text-color,#111);margin:32px;text-align:center}button{border:0;border-radius:12px;background:var(--tg-theme-button-color,#2481cc);color:var(--tg-theme-button-text-color,#fff);font-size:17px;font-weight:600;padding:14px 30px;width:100%}p{color:var(--tg-theme-hint-color,#666)}</style></head><body><h2>Movie access</h2><p>Unlock dabane ke baad video 60 seconds mein bot chat mein aayegi. Access 3 hours ke liye hai.</p><button id="unlock">Unlock video</button><script>const app=window.Telegram.WebApp;app.ready();document.getElementById('unlock').onclick=()=>{const token=new URLSearchParams(location.search).get('token');if(!token)return;app.sendData('unlock:'+token);app.close()};</script></body></html>
