<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social Media Launcher</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}
.container{
    width:90%;
    max-width:450px;
}
button{
    width:100%;
    padding:15px;
    margin:8px 0;
    border:none;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
    color:#fff;
}
.google{background:#4285F4;}
.youtube{background:#FF0000;}
.facebook{background:#1877F2;}
.instagram{background:#E1306C;}
.x{background:#000;}
.tiktok{background:#111;}
.telegram{background:#229ED9;}
.whatsapp{background:#25D366;}
.snapchat{background:#FFFC00;color:#000;}
.linkedin{background:#0A66C2;}
.pinterest{background:#BD081C;}
.reddit{background:#FF4500;}
</style>
</head>

<body>

<div class="container">

<button class="google" onclick="openSite('https://www.google.com')">Google</button>

<button class="youtube" onclick="openSite('https://www.youtube.com')">YouTube</button>

<button class="facebook" onclick="openSite('https://www.facebook.com')">Facebook</button>

<button class="instagram" onclick="openSite('https://www.instagram.com')">Instagram</button>

<button class="x" onclick="openSite('https://x.com')">X (Twitter)</button>

<button class="tiktok" onclick="openSite('https://www.tiktok.com')">TikTok</button>

<button class="telegram" onclick="openSite('https://web.telegram.org')">Telegram</button>

<button class="whatsapp" onclick="openSite('https://web.whatsapp.com')">WhatsApp</button>

<button class="snapchat" onclick="openSite('https://www.snapchat.com')">Snapchat</button>

<button class="linkedin" onclick="openSite('https://www.linkedin.com')">LinkedIn</button>

<button class="pinterest" onclick="openSite('https://www.pinterest.com')">Pinterest</button>

<button class="reddit" onclick="openSite('https://www.reddit.com')">Reddit</button>

</div>

<script>
function openSite(url){
    window.location.href = url;
}
</script>

</body>
</html>
