<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Downloader</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:Arial;background:#000;color:#fff;padding:20px}
        .container{max-width:500px;margin:0 auto}
        input,button{width:100%;padding:15px;margin:10px 0;border:none;border-radius:10px;font-size:16px}
        input{background:#222;color:#fff;border:2px solid #333}
        button{background:#ff0050;color:#fff;font-weight:bold;cursor:pointer}
        button:active{transform:scale(0.95)}
        #status{padding:15px;margin:10px 0;border-radius:10px;text-align:center}
        .loading{background:#333;color:#ff0}
        .error{background:#511;color:#f44}
        .success{background:#151;color:#4f4}
        video{width:100%;border-radius:10px;margin:10px 0;max-height:400px;background:#000}
        .hidden{display:none}
        .download-btn{background:#00d4ff;color:#000;margin:5px 0}
        .btn-group{display:flex;gap:10px}
        .btn-group button{flex:1}
        .copy-btn{background:#333;color:#fff}
    </style>
</head>
<body>

<div class="container">
    <h1 style="text-align:center;color:#ff0050">🎵 TikTok Downloader</h1>
    <p style="text-align:center;color:#888;margin:10px 0">Paste TikTok URL and download</p>
    
    <input type="text" id="urlInput" placeholder="https://www.tiktok.com/@user/video/123...">
    <button id="getBtn">📥 Get Video</button>
    
    <div id="status">Paste URL and click Get Video</div>
    
    <div id="videoContainer" class="hidden">
        <video id="videoPlayer" controls playsinline></video>
        <div class="btn-group">
            <button id="downloadBtn" class="download-btn">⬇️ Download</button>
            <button id="copyUrlBtn" class="copy-btn">📋 Copy URL</button>
        </div>
        <button id="openInBrowserBtn" style="background:#4CAF50;margin-top:5px">🌐 Open in Browser</button>
    </div>
</div>

<script>
const urlInput = document.getElementById('urlInput');
const getBtn = document.getElementById('getBtn');
const statusDiv = document.getElementById('status');
const videoContainer = document.getElementById('videoContainer');
const videoPlayer = document.getElementById('videoPlayer');
const downloadBtn = document.getElementById('downloadBtn');
const copyUrlBtn = document.getElementById('copyUrlBtn');
const openInBrowserBtn = document.getElementById('openInBrowserBtn');

let currentUrl = '';
let directVideoUrl = '';

getBtn.onclick = () => {
    const url = urlInput.value.trim();
    if (!url) {
        statusDiv.className = 'error';
        statusDiv.textContent = '❌ Please enter a URL';
        return;
    }
    fetchVideo(url);
};

urlInput.onkeypress = (e) => {
    if (e.key === 'Enter') getBtn.click();
};

async function fetchVideo(url) {
    statusDiv.className = 'loading';
    statusDiv.textContent = '⏳ Fetching video...';
    videoContainer.classList.add('hidden');

    try {
        // Try different APIs
        let data = null;
        
        // API 1: tikwm.com
        try {
            const api = `https://www.tikwm.com/api/?url=${encodeURIComponent(url)}`;
            const res = await fetch(api);
            data = await res.json();
            if (data.code === 0) {
                currentUrl = data.data.play;
                directVideoUrl = data.data.play;
            }
        } catch(e) {
            console.log('API 1 failed, trying API 2');
        }

        // API 2: Alternative API
        if (!currentUrl) {
            try {
                const api = `https://api.tikmate.app/api/lookup?url=${encodeURIComponent(url)}`;
                const res = await fetch(api);
                const result = await res.json();
                if (result.success) {
                    currentUrl = result.video_url;
                    directVideoUrl = result.video_url;
                }
            } catch(e) {
                console.log('API 2 failed');
            }
        }

        if (!currentUrl) {
            statusDiv.className = 'error';
            statusDiv.textContent = '❌ Could not fetch video. Try another link.';
            return;
        }

        // Show video
        videoPlayer.src = currentUrl;
        videoPlayer.load();
        videoContainer.classList.remove('hidden');
        
        statusDiv.className = 'success';
        statusDiv.textContent = '✅ Video loaded! Choose download option below.';

    } catch (err) {
        statusDiv.className = 'error';
        statusDiv.textContent = '❌ Error: ' + err.message;
        console.error(err);
    }
}

// Download Methods
downloadBtn.onclick = async () => {
    if (!currentUrl) {
        statusDiv.className = 'error';
        statusDiv.textContent = '❌ No video to download';
        return;
    }

    statusDiv.className = 'loading';
    statusDiv.textContent = '⏳ Downloading...';

    // Try multiple download methods
    try {
        await downloadWithFetch(currentUrl);
    } catch (e) {
        console.log('Fetch download failed, trying alternative');
        try {
            await downloadWithIframe(currentUrl);
        } catch (e2) {
            console.log('Iframe download failed, trying direct');
            downloadDirect(currentUrl);
        }
    }
};

// Method 1: Fetch + Blob
async function downloadWithFetch(url) {
    const response = await fetch(url, {
        mode: 'cors',
        headers: {
            'Accept': 'video/mp4,video/*'
        }
    });
    
    if (!response.ok) throw new Error('Fetch failed');
    
    const blob = await response.blob();
    const blobUrl = URL.createObjectURL(blob);
    
    const a = document.createElement('a');
    a.href = blobUrl;
    a.download = `tiktok_${Date.now()}.mp4`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    
    setTimeout(() => URL.revokeObjectURL(blobUrl), 5000);
    
    statusDiv.className = 'success';
    statusDiv.textContent = '✅ Download started!';
}

// Method 2: Iframe
function downloadWithIframe(url) {
    return new Promise((resolve, reject) => {
        const iframe = document.createElement('iframe');
        iframe.style.display = 'none';
        iframe.src = url;
        document.body.appendChild(iframe);
        
        setTimeout(() => {
            document.body.removeChild(iframe);
            resolve();
        }, 3000);
        
        statusDiv.className = 'success';
        statusDiv.textContent = '✅ Download attempted via iframe';
    });
}

// Method 3: Direct open
function downloadDirect(url) {
    window.open(url, '_blank');
    statusDiv.className = 'success';
    statusDiv.textContent = '✅ Video opened in new tab. Right-click to save.';
}

// Copy URL
copyUrlBtn.onclick = () => {
    if (!currentUrl) {
        statusDiv.className = 'error';
        statusDiv.textContent = '❌ No URL to copy';
        return;
    }
    
    navigator.clipboard.writeText(currentUrl).then(() => {
        statusDiv.className = 'success';
        statusDiv.textContent = '✅ URL copied to clipboard!';
    }).catch(() => {
        // Fallback
        const input = document.createElement('input');
        input.value = currentUrl;
        document.body.appendChild(input);
        input.select();
        document.execCommand('copy');
        document.body.removeChild(input);
        statusDiv.className = 'success';
        statusDiv.textContent = '✅ URL copied!';
    });
};

// Open in browser
openInBrowserBtn.onclick = () => {
    if (!currentUrl) {
        statusDiv.className = 'error';
        statusDiv.textContent = '❌ No URL to open';
        return;
    }
    window.open(currentUrl, '_blank');
    statusDiv.className = 'success';
    statusDiv.textContent = '✅ Opened in new tab';
};

// Auto load from URL parameter
const params = new URLSearchParams(window.location.search);
const urlParam = params.get('url');
if (urlParam) {
    urlInput.value = urlParam;
    fetchVideo(urlParam);
}
</script>

</body>
</html>hy
