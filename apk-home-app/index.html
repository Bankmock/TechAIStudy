<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Agent Detector</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    padding:20px;
}
.container{
    max-width:700px;
    margin:auto;
    background:#fff;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.1);
}
h2{
    text-align:center;
}
.info{
    margin:10px 0;
    padding:10px;
    background:#eee;
    border-radius:6px;
    word-break:break-word;
}
</style>
</head>
<body>

<div class="container">
<h2>User Agent Information</h2>

<div class="info"><b>Browser:</b> <span id="browser"></span></div>
<div class="info"><b>Operating System:</b> <span id="os"></span></div>
<div class="info"><b>Device:</b> <span id="device"></span></div>
<div class="info"><b>Platform:</b> <span id="platform"></span></div>
<div class="info"><b>Language:</b> <span id="language"></span></div>
<div class="info"><b>Screen Resolution:</b> <span id="screen"></span></div>
<div class="info"><b>User Agent:</b> <span id="ua"></span></div>

</div>

<script>
const ua = navigator.userAgent;

function browser(){
    if(ua.includes("Edg")) return "Microsoft Edge";
    if(ua.includes("OPR")) return "Opera";
    if(ua.includes("Chrome")) return "Google Chrome";
    if(ua.includes("Firefox")) return "Mozilla Firefox";
    if(ua.includes("Safari") && !ua.includes("Chrome")) return "Safari";
    return "Unknown";
}

function os(){
    if(ua.includes("Windows")) return "Windows";
    if(ua.includes("Android")) return "Android";
    if(ua.includes("iPhone") || ua.includes("iPad")) return "iOS";
    if(ua.includes("Mac")) return "macOS";
    if(ua.includes("Linux")) return "Linux";
    return "Unknown";
}

function device(){
    if(/Mobile/i.test(ua)) return "Mobile";
    if(/Tablet|iPad/i.test(ua)) return "Tablet";
    return "Desktop";
}

document.getElementById("browser").textContent = browser();
document.getElementById("os").textContent = os();
document.getElementById("device").textContent = device();
document.getElementById("platform").textContent = navigator.platform;
document.getElementById("language").textContent = navigator.language;
document.getElementById("screen").textContent =
screen.width + " × " + screen.height;
document.getElementById("ua").textContent = ua;
</script>

</body>
</html>
