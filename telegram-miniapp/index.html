<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>Watch Ad & Download</title>

<style>
:root {
    --bg: #0f172a;
    --card: rgba(255,255,255,0.04);
    --border: rgba(255,255,255,0.10);
    --text: #f1f5f9;
    --muted: #94a3b8;
    --accent: #22c55e;
    --accent2: #0ea5e9;
    --accent-grad: linear-gradient(135deg, #22c55e, #0ea5e9);
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: 'Segoe UI', system-ui, -apple-system,
                 BlinkMacSystemFont, Roboto, sans-serif;

    background: var(--bg);
    color: var(--text);

    min-height: 100dvh;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 20px;
}

.card {
    width: 100%;
    max-width: 400px;

    background: var(--card);

    border: 1px solid var(--border);
    border-radius: 20px;

    padding: 28px 24px;

    backdrop-filter: blur(8px);

    box-shadow:
        0 20px 60px rgba(0,0,0,0.45);

    text-align: center;

    transition:
        opacity .3s ease,
        transform .3s ease;
}

/* TIMER SECTION */

#timerSection {
    display: block;
}

#timerSection.hidden {
    display: none !important;
}

.timer {
    font-size: 52px;
    font-weight: 700;

    margin: 10px 0 4px;
}

.seconds {
    color: var(--muted);
    font-size: 13px;
}

.btn {
    display: flex;

    align-items: center;
    justify-content: center;

    gap: 8px;

    width: 100%;

    padding: 14px;

    margin-top: 20px;

    font-size: 15px;
    font-weight: 600;

    border: none;
    border-radius: 14px;

    cursor: pointer;

    color: #fff;

    background: var(--accent-grad);

    transition:
        transform .15s,
        opacity .15s;
}

.btn:active {
    transform: scale(0.97);
}

.btn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
}

/* TOAST */

.toast {
    position: fixed;

    left: 50%;
    bottom: 40px;

    transform: translate(-50%, 100px);

    background: #14532d;

    border: 1px solid #16a34a;

    color: #f0fdf4;

    padding: 14px 20px;

    border-radius: 14px;

    font-size: 14px;
    font-weight: 600;

    box-shadow:
        0 12px 32px rgba(0,0,0,0.4);

    display: flex;

    align-items: center;

    gap: 10px;

    transition:
        transform .35s ease;

    z-index: 99;

    max-width: 90%;

    text-align: center;
}

.toast.show {
    transform: translate(-50%, 0);
}
</style>
</head>

<body>

<div class="card" id="mainCard">

    <div id="timerSection">

        <div class="timer" id="timer">30</div>

        <div class="seconds">
            seconds
        </div>

        <button
            class="btn"
            id="downloadBtn"
            disabled>

            🔒 Please Wait

        </button>

    </div>

</div>


<!-- TOAST -->

<div class="toast" id="toast">

    <span id="toastIcon">✅</span>

    <span id="toastText"></span>

</div>


<script>
(function () {

    'use strict';


    /* =========================
       URL PARAMETERS
    ========================= */

    const params =
        new URLSearchParams(
            window.location.search
        );


    const videoUrl =
        params.get('url') || '';


    const botUsername =
        params.get('bot') ||
        'videosaverXdownloaderBot';


    let seconds =
        parseInt(
            params.get('timer') ||
            params.get('t') ||
            '30',
            10
        );


    if (isNaN(seconds) || seconds < 5) {
        seconds = 30;
    }


    /* =========================
       TELEGRAM
    ========================= */

    let tg = null;


    try {

        if (
            window.Telegram &&
            window.Telegram.WebApp
        ) {

            tg =
                window.Telegram.WebApp;

            tg.ready();
            tg.expand();

        }

    } catch (e) {
        console.log(e);
    }


    /* =========================
       ELEMENTS
    ========================= */

    const timerSection =
        document.getElementById(
            'timerSection'
        );


    const timerEl =
        document.getElementById(
            'timer'
        );


    const downloadBtn =
        document.getElementById(
            'downloadBtn'
        );


    const toast =
        document.getElementById(
            'toast'
        );


    const toastText =
        document.getElementById(
            'toastText'
        );


    const toastIcon =
        document.getElementById(
            'toastIcon'
        );


    /* =========================
       TOAST
    ========================= */

    function showToast(
        message,
        icon = '✅'
    ) {

        toastIcon.textContent = icon;

        toastText.textContent =
            message;

        toast.classList.add('show');


        clearTimeout(
            showToast.timer
        );


        showToast.timer =
            setTimeout(
                function () {

                    toast.classList.remove(
                        'show'
                    );

                },
                4000
            );

    }


    /* =========================
       VERIFY
    ========================= */

    function openBotVerify() {

        const payload =
            JSON.stringify({
                v: 'watchads:done'
            });


        /*
         * Telegram Mini App
         */

        if (
            window.Telegram &&
            window.Telegram.WebApp &&
            typeof
            window.Telegram.WebApp.sendData
            === 'function'
        ) {

            try {

                window.Telegram.WebApp
                    .sendData(payload);

                return true;

            } catch (e) {}

        }


        /*
         * Normal Telegram link
         */

        const link =
            'https://t.me/' +
            botUsername +
            '?start=watchadsverify';


        if (
            tg &&
            typeof tg.openTelegramLink
            === 'function'
        ) {

            try {

                tg.openTelegramLink(
                    link
                );

                return true;

            } catch (e) {}

        }


        window.open(
            link,
            '_blank'
        );

        return true;

    }


    /* =========================
       DOWNLOAD BUTTON
    ========================= */

    function verifyAndDownload() {

        /*
         * Hide timer immediately
         */

        timerSection.classList.add(
            'hidden'
        );


        /*
         * Show success message
         */

        showToast(
            'You can go back now, downloading will start.',
            '⬇️'
        );


        /*
         * Tell Telegram bot
         */

        openBotVerify();


        /*
         * Close Mini App after
         * short delay
         */

        if (
            tg &&
            typeof tg.close === 'function'
        ) {

            setTimeout(
                function () {

                    try {

                        tg.close();

                    } catch (e) {}

                },
                1200
            );

        }

    }


    /* =========================
       TIMER
    ========================= */

    function startTimer() {

        let remaining =
            seconds;


        /*
         * Timer visible
         */

        timerSection.classList.remove(
            'hidden'
        );


        timerEl.textContent =
            remaining;


        downloadBtn.disabled =
            true;


        downloadBtn.textContent =
            '🔒 Please Wait';


        const interval =
            setInterval(
                function () {

                    remaining--;


                    timerEl.textContent =
                        Math.max(
                            remaining,
                            0
                        );


                    /*
                     * TIMER COMPLETE
                     */

                    if (
                        remaining <= 0
                    ) {

                        clearInterval(
                            interval
                        );


                        downloadBtn.disabled =
                            false;


                        downloadBtn.textContent =
                            '✅ Verify & Download';


                        downloadBtn.onclick =
                            verifyAndDownload;

                    }

                },
                1000
            );

    }


    /* =========================
       START
    ========================= */

    startTimer();


})();
</script>

</body>
</html>
